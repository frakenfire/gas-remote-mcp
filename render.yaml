services:
  - type: web
    name: gas-remote-mcp
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MCP_BEARER_TOKEN
        value: "mcp_secret_token_1234!"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_REFRESH_TOKEN
        value: ""
      - key: ALLOWED_SCRIPT_IDS
        value: ""
